<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icône de SPARQLSandbox Admin : le graphe RDF du site, avec un engrenage d'administration -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8a8c"/>
      <stop offset="1" stop-color="#3f4fa0"/>
    </linearGradient>
    <filter id="ombre" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fond)" filter="url(#ombre)"/>
  <g transform="translate(100 100) scale(12.875)">
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".95">
      <line x1="18" y1="20" x2="46" y2="18"/>
      <line x1="18" y1="20" x2="30" y2="46"/>
      <line x1="46" y1="18" x2="30" y2="46"/>
    </g>
    <circle cx="18" cy="20" r="8" fill="#ffffff"/>
    <circle cx="46" cy="18" r="7" fill="#d9f2f3"/>
    <rect x="21" y="40" width="18" height="12" rx="3" fill="#ffd98a"/>
  </g>
  <!-- engrenage : 10 dents -->
  <g transform="translate(722 722)">
    <circle r="152" fill="#2b3478"/>
    <circle r="108" fill="none" stroke="#ffd98a" stroke-width="46" stroke-dasharray="33.9 33.9" transform="rotate(-9)"/>
    <circle r="92" fill="#ffd98a"/>
    <circle r="36" fill="#2b3478"/>
  </g>
</svg>
