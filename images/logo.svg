<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SPARQL Sandbox">
  <!-- Un petit graphe RDF : trois nœuds reliés par des arcs -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".95">
    <line x1="18" y1="20" x2="46" y2="18"/>
    <line x1="18" y1="20" x2="30" y2="46"/>
    <line x1="46" y1="18" x2="30" y2="46"/>
  </g>
  <circle cx="18" cy="20" r="8" fill="#ffffff"/>
  <circle cx="46" cy="18" r="7" fill="#d9f2f3"/>
  <rect x="21" y="40" width="18" height="12" rx="3" fill="#ffd98a"/>
</svg>
